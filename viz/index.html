<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SL5+TP20 优化回测 · K线对比</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a22;
      --border: #2a3140;
      --text: #e6eaf2;
      --muted: #8b95a8;
      --accent: #5b9cf5;
      --green: #3dd68c;
      --red: #f07178;
      --orange: #f5a623;
      --purple: #c792ea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      background: var(--panel);
    }
    header h1 { font-size: 15px; font-weight: 600; }
    .stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .stats b { color: var(--text); }
    .stats .pos b { color: var(--green); }
    .stats .neg b { color: var(--red); }
    main { flex: 1; display: grid; grid-template-columns: 300px 1fr 280px; min-height: 0; }
    aside, .compare {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .compare { border-right: none; border-left: 1px solid var(--border); }
    .panel-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
    }
    .filters {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .filter-row { display: flex; gap: 6px; }
    .filter-row select { flex: 1; }
    .trade-list {
      flex: 1;
      overflow-y: auto;
      font-size: 11px;
    }
    .trade-item {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .trade-item:hover { background: #1e2430; }
    .trade-item.active { background: #243044; border-left: 3px solid var(--accent); }
    .trade-item .row1 { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .trade-item .ticket { font-weight: 600; color: var(--accent); }
    .trade-item .delta-pos { color: var(--green); }
    .trade-item .delta-neg { color: var(--red); }
    .trade-item .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    .tag {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--bg);
      color: var(--muted);
    }
    .tag.changed { color: var(--orange); border: 1px solid var(--orange); }
    .center { display: flex; flex-direction: column; min-height: 0; }
    .chart-toolbar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      background: var(--panel);
    }
    .nav-btns button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .nav-btns button:hover { border-color: var(--accent); }
    #chart { flex: 1; min-height: 200px; }
    .legend {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 11px;
      color: var(--muted);
      background: var(--panel);
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 2px;
      margin-right: 5px;
      vertical-align: middle;
    }
    .l-entry::before { background: var(--accent); height: 3px; }
    .l-orig-sl::before { background: var(--red); }
    .l-new-sl::before { background: var(--orange); }
    .l-new-tp::before { background: #6bc9a8; }
    .l-tp::before { background: var(--green); }
    .l-orig-close::before { background: var(--purple); }
    .compare-body { flex: 1; overflow-y: auto; padding: 10px 12px; font-size: 12px; }
    .cmp-block { margin-bottom: 14px; }
    .cmp-block h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .cmp-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #1e2430;
    }
    .cmp-row .label { color: var(--muted); }
    .col-orig .val { color: var(--purple); }
    .col-sim .val { color: var(--orange); }
    .highlight-box {
      background: var(--bg);
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid var(--border);
    }
    .delta-big { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .empty-chart {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }
    @media (max-width: 1100px) {
      main { grid-template-columns: 260px 1fr; }
      .compare { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>XAUUSD 优化回测 · SL5 + TP20</h1>
    <div class="stats" id="globalStats"></div>
    <a href="/limits.html" style="font-size:12px;color:#5b9cf5">挂单踏空 →</a>
    <a href="/latest.html" style="font-size:12px;color:#5b9cf5;margin-left:8px">最新策略对比 →</a>
  </header>
  <main>
    <aside>
      <div class="panel-head">交易列表 (<span id="listCount">0</span>)</div>
      <div class="filters">
        <input type="search" id="search" placeholder="搜索 Ticket / 日期…" />
        <div class="filter-row">
          <select id="filterDir">
            <option value="">方向：全部</option>
            <option value="buy">做多 buy</option>
            <option value="sell">做空 sell</option>
          </select>
          <select id="filterChange">
            <option value="">结果：全部</option>
            <option value="improved">改善 (Δ&gt;0)</option>
            <option value="worse">变差 (Δ&lt;0)</option>
            <option value="saved">原SL→模拟未SL</option>
            <option value="changed">出场变化</option>
          </select>
        </div>
        <select id="filterExit">
          <option value="">原出场：全部</option>
          <option value="sl">原止损 [sl]</option>
          <option value="tp">原止盈 [tp]</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div class="trade-list" id="tradeList"></div>
    </aside>
    <section class="center">
      <div class="chart-toolbar">
        <div id="chartTitle">请选择左侧一笔交易</div>
        <div class="nav-btns">
          <button type="button" id="btnPrev">← 上一笔</button>
          <button type="button" id="btnNext">下一笔 →</button>
        </div>
      </div>
      <div id="chart"></div>
      <div class="empty-chart" id="emptyHint" style="display:none">加载中…</div>
      <div class="legend">
        <span class="l-entry">入场价</span>
        <span class="l-orig-sl">原止损 (~3点)</span>
        <span class="l-new-sl">建议止损 SL5</span>
        <span class="l-new-tp">建议止盈 TP20</span>
        <span class="l-tp">原止盈 (远)</span>
        <span class="l-orig-close">原平仓价</span>
        <span>横轴：经纪商时间 UTC+3</span>
      </div>
    </section>
    <div class="compare">
      <div class="panel-head">订单对比</div>
      <div class="compare-body" id="comparePanel">
        <p style="color:var(--muted)">原策略 vs 优化1(SL5) vs 优化1+2(SL5+TP20)</p>
      </div>
    </div>
  </main>
  <script>
    const REASON_ZH = { sl: "止损", tp: "止盈", time: "按原平仓", other: "其他" };
    const EXIT_ZH = { sl: "原[sl]", tp: "原[tp]", other: "其他" };

    let allTrades = [];
    let filtered = [];
    let currentIdx = -1;
    let chart = null;
    let series = null;
    let priceLines = [];
    let brokerOffsetHours = 3;

    function fmt(n, d = 2) {
      if (n == null || Number.isNaN(n)) return "—";
      return Number(n).toFixed(d);
    }
    function fmtUsd(n) {
      const s = fmt(n);
      return (n >= 0 ? "+" : "") + s + " USD";
    }

    function formatBrokerTime(ts) {
      const shifted = new Date((ts + brokerOffsetHours * 3600) * 1000);
      const pad = (n) => String(n).padStart(2, "0");
      return `${shifted.getUTCFullYear()}-${pad(shifted.getUTCMonth() + 1)}-${pad(shifted.getUTCDate())} ${pad(shifted.getUTCHours())}:${pad(shifted.getUTCMinutes())}`;
    }

    async function init() {
      const res = await fetch("/api/trades");
      allTrades = await res.json();
      renderGlobalStats();
      applyFilters();
      bindEvents();
    }

    function renderGlobalStats() {
      const orig = allTrades.reduce((s, t) => s + t.orig_net, 0);
      const sim = allTrades.reduce((s, t) => s + t.sim_net, 0);
      const delta = sim - orig;
      document.getElementById("globalStats").innerHTML = `
        <span>笔数 <b>${allTrades.length}</b></span>
        <span>原净利 <b>${fmt(orig)}</b></span>
        <span>SL5+TP20 <b>${fmt(sim)}</b></span>
        <span class="${delta >= 0 ? "pos" : "neg"}">Δ <b>${fmtUsd(delta)}</b></span>
      `;
    }

    function applyFilters() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const dir = document.getElementById("filterDir").value;
      const chg = document.getElementById("filterChange").value;
      const ex = document.getElementById("filterExit").value;

      filtered = allTrades.filter((t) => {
        if (dir && t.direction !== dir) return false;
        if (ex && t.orig_exit !== ex) return false;
        if (chg === "improved" && t.delta <= 0) return false;
        if (chg === "worse" && t.delta >= 0) return false;
        if (chg === "saved" && !(t.orig_exit === "sl" && t.sim_exit_reason !== "sl"))
          return false;
        if (chg === "changed" && !t.changed) return false;
        if (q) {
          const hay = `${t.ticket} ${t.open_time} ${t.direction}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById("listCount").textContent = filtered.length;
      renderList();
      if (currentIdx >= filtered.length) currentIdx = filtered.length - 1;
      if (filtered.length && currentIdx < 0) selectTrade(0);
      else if (!filtered.length) clearChart();
    }

    function renderList() {
      const el = document.getElementById("tradeList");
      el.innerHTML = filtered
        .map((t, i) => {
          const dc = t.delta >= 0 ? "delta-pos" : "delta-neg";
          const active = i === currentIdx ? "active" : "";
          const chgTag = t.changed ? '<span class="tag changed">出场变化</span>' : "";
          return `<div class="trade-item ${active}" data-idx="${i}">
            <div class="row1">
              <span class="ticket">#${t.ticket}</span>
              <span class="${dc}">${fmtUsd(t.delta)}</span>
            </div>
            <div>${t.direction.toUpperCase()} · ${t.open_dt}</div>
            <div class="tags">
              <span class="tag">${EXIT_ZH[t.orig_exit]}</span>
              <span class="tag">→ ${REASON_ZH[t.sim_exit_reason]}</span>
              ${chgTag}
            </div>
          </div>`;
        })
        .join("");

      el.querySelectorAll(".trade-item").forEach((node) => {
        node.addEventListener("click", () => selectTrade(+node.dataset.idx));
      });
    }

    function bindEvents() {
      ["search", "filterDir", "filterChange", "filterExit"].forEach((id) => {
        document.getElementById(id).addEventListener("input", () => {
          currentIdx = -1;
          applyFilters();
        });
      });
      document.getElementById("btnPrev").onclick = () => {
        if (currentIdx > 0) selectTrade(currentIdx - 1);
      };
      document.getElementById("btnNext").onclick = () => {
        if (currentIdx < filtered.length - 1) selectTrade(currentIdx + 1);
      };
      window.addEventListener("resize", () => {
        if (chart) chart.applyOptions({ width: document.getElementById("chart").clientWidth });
      });
    }

    async function selectTrade(idx) {
      if (!filtered[idx]) return;
      currentIdx = idx;
      renderList();
      const t = filtered[idx];
      document.getElementById("chartTitle").textContent =
        `#${t.ticket} ${t.direction.toUpperCase()} · ${t.open_dt} → ${t.close_dt} (经纪商时间 UTC+${brokerOffsetHours})`;

      document.getElementById("emptyHint").style.display = "flex";
      document.getElementById("emptyHint").textContent = "加载 K 线…";

      const detail = await fetch(`/api/trade/${t.ticket}`).then((r) => r.json());
      brokerOffsetHours = detail.broker_offset_hours ?? 3;
      document.getElementById("emptyHint").style.display = "none";
      renderChart(detail);
      renderCompare(detail);
    }

    function clearChart() {
      if (chart) {
        chart.remove();
        chart = null;
        series = null;
      }
      document.getElementById("comparePanel").innerHTML =
        '<p style="color:var(--muted)">无匹配交易</p>';
    }

    function renderChart(d) {
      const container = document.getElementById("chart");
      if (chart) {
        chart.remove();
        chart = null;
      }

      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { color: "#0f1115" },
          textColor: "#8b95a8",
        },
        grid: {
          vertLines: { color: "#1e2430" },
          horzLines: { color: "#1e2430" },
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: "#2a3140" },
        timeScale: {
          borderColor: "#2a3140",
          timeVisible: true,
          secondsVisible: false,
        },
        localization: {
          timeFormatter: (ts) => formatBrokerTime(ts),
        },
      });

      series = chart.addCandlestickSeries({
        upColor: "#3dd68c",
        downColor: "#f07178",
        borderUpColor: "#3dd68c",
        borderDownColor: "#f07178",
        wickUpColor: "#3dd68c",
        wickDownColor: "#f07178",
      });

      series.setData(d.bars);

      priceLines.forEach((pl) => series.removePriceLine(pl));
      priceLines = [];

      const addLine = (price, color, title, style) => {
        if (price == null || price <= 0) return;
        priceLines.push(
          series.createPriceLine({
            price,
            color,
            lineWidth: style === "dashed" ? 1 : 2,
            lineStyle:
              style === "dashed"
                ? LightweightCharts.LineStyle.Dashed
                : LightweightCharts.LineStyle.Solid,
            axisLabelVisible: true,
            title,
          })
        );
      };

      addLine(d.entry, "#5b9cf5", "入场", "solid");
      addLine(d.orig_sl, "#f07178", "原SL", "dashed");
      addLine(d.suggested_sl, "#f5a623", "SL5", "solid");
      addLine(d.suggested_tp, "#6bc9a8", "TP20", "solid");
      if (d.orig_tp) addLine(d.orig_tp, "#3dd68c", "原TP", "dashed");
      addLine(d.orig_close, "#c792ea", "原平仓", "dashed");
      const sim = d.sim_sl5_tp20;
      if (Math.abs(d.orig_close - sim.exit_px) > 0.01) {
        addLine(sim.exit_px, "#f5a623", "模拟平", "dashed");
      }

      const markers = [];
      const isBuy = d.direction === "buy";

      markers.push({
        time: d.open_ts,
        position: isBuy ? "belowBar" : "aboveBar",
        color: "#5b9cf5",
        shape: isBuy ? "arrowUp" : "arrowDown",
        text: "开",
      });
      markers.push({
        time: d.close_ts,
        position: isBuy ? "aboveBar" : "belowBar",
        color: "#c792ea",
        shape: "circle",
        text: "原平",
      });
      if (d.sim_exit_ts !== d.close_ts) {
        markers.push({
          time: d.sim_exit_ts,
          position: isBuy ? "aboveBar" : "belowBar",
          color: "#6bc9a8",
          shape: "square",
          text: "SL5+TP20",
        });
      }

      series.setMarkers(markers);
      chart.timeScale().fitContent();
    }

    function renderCompare(d) {
      const o1 = d.sim_sl5_origtp;
      const o2 = d.sim_sl5_tp20;
      const deltaCls = o2.delta >= 0 ? "delta-pos" : "delta-neg";

      document.getElementById("comparePanel").innerHTML = `
        <div class="cmp-block">
          <h3>基本信息</h3>
          <div class="cmp-row"><span class="label">Ticket</span><span>#${d.ticket}</span></div>
          <div class="cmp-row"><span class="label">方向 / 手数</span><span>${d.direction.toUpperCase()} · ${d.size}</span></div>
          <div class="cmp-row"><span class="label">持仓 (经纪商)</span><span>${d.open_time_broker}<br/>→ ${d.close_time_broker}</span></div>
          <div class="cmp-row"><span class="label">原止损距离</span><span>${fmt(d.sl_dist)} 点</span></div>
        </div>

        <div class="cmp-block">
          <h3>价格水平</h3>
          <div class="cmp-row"><span class="label">入场</span><span>${fmt(d.entry)}</span></div>
          <div class="cmp-row col-orig"><span class="label">原止损</span><span class="val">${fmt(d.orig_sl)}</span></div>
          <div class="cmp-row col-sim"><span class="label">建议 SL5</span><span class="val">${fmt(d.suggested_sl)}</span></div>
          ${
            d.orig_tp
              ? `<div class="cmp-row col-orig"><span class="label">原止盈</span><span class="val">${fmt(d.orig_tp)}</span></div>`
              : ""
          }
          <div class="cmp-row col-sim"><span class="label">建议 TP20</span><span class="val">${fmt(d.suggested_tp)}</span></div>
        </div>

        <div class="cmp-block">
          <h3>出场对比</h3>
          <div class="cmp-row col-orig">
            <span class="label">原策略</span>
            <span class="val">${EXIT_ZH[d.orig_exit]} @ ${fmt(d.orig_close)}</span>
          </div>
          <div class="cmp-row">
            <span class="label">优化1 SL5+原TP</span>
            <span>${REASON_ZH[o1.exit_reason]} @ ${fmt(o1.exit_px)}</span>
          </div>
          <div class="cmp-row col-sim">
            <span class="label">优化1+2 SL5+TP20</span>
            <span class="val">${REASON_ZH[o2.exit_reason]} @ ${fmt(o2.exit_px)}</span>
          </div>
        </div>

        <div class="cmp-block">
          <h3>盈亏对比 (含佣金)</h3>
          <div class="cmp-row col-orig">
            <span class="label">原净利</span>
            <span class="val">${fmtUsd(d.orig_net)}</span>
          </div>
          <div class="cmp-row">
            <span class="label">SL5+原TP</span>
            <span>${fmtUsd(o1.net)} (${fmtUsd(o1.delta)})</span>
          </div>
          <div class="cmp-row col-sim">
            <span class="label">SL5+TP20</span>
            <span class="val">${fmtUsd(o2.net)}</span>
          </div>
          <div class="highlight-box">
            <span class="label">SL5+TP20 相对原单 Δ</span>
            <div class="delta-big ${deltaCls}">${fmtUsd(o2.delta)}</div>
          </div>
        </div>
      `;
    }

    init().catch((e) => {
      document.getElementById("emptyHint").style.display = "flex";
      document.getElementById("emptyHint").textContent =
        "无法连接 API，请先运行: python3 viz_server.py";
      console.error(e);
    });
  </script>
</body>
</html>
