<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>挂单踏空分析</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6eaf2; padding: 16px; max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 18px; }
    a { color: #5b9cf5; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; }
    th, td { border: 1px solid #2a3140; padding: 6px 8px; text-align: right; }
    th { background: #161a22; }
    td:first-child, th:first-child { text-align: left; }
    .muted { color: #8b95a8; font-size: 13px; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>取消挂单 · 近距踏空与偏移模拟</h1>
  <p class="muted">
    <a href="/">← 返回 K 线对比</a> · 运行 <code>python3 analyze_limits.py</code> 更新数据
  </p>
  <h2>偏移汇总（触及即成交 + SL5+TP20）</h2>
  <table id="summary"></table>
  <h2>近距踏空 (0,2] 点（最多 200 条）</h2>
  <table id="near"></table>
  <script>
    async function load() {
      const sum = await fetch("/api/limits/summary").then((r) => r.json());
      const near = await fetch("/api/limits/near_miss").then((r) => r.json());
      if (sum.error) {
        document.body.innerHTML += `<p>${sum.error}</p>`;
        return;
      }
      const sk = Object.keys(sum[0] || {});
      document.getElementById("summary").innerHTML =
        "<tr>" + sk.map((k) => `<th>${k}</th>`).join("") + "</tr>" +
        sum.map((r) => "<tr>" + sk.map((k) => `<td>${r[k] ?? ""}</td>`).join("") + "</tr>").join("");
      if (!near.length) return;
      const nk = Object.keys(near[0]);
      document.getElementById("near").innerHTML =
        "<tr>" + nk.map((k) => `<th>${k}</th>`).join("") + "</tr>" +
        near.map((r) => "<tr>" + nk.map((k) => `<td>${r[k] ?? ""}</td>`).join("") + "</tr>").join("");
    }
    load();
  </script>
</body>
</html>
