<!DOCTYPE html>
<html lang="zh-CN" data-i18n-title="report.pageTitle">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>交易报告</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="stylesheet" href="/styles.css?v=18" />
</head>
<body class="report-page">
  <header class="report-page-header">
    <a href="/" class="pat-back-link" data-i18n="report.backReplay">回测练习</a>
    <h1 class="report-page-title" data-i18n="report.pageTitle">交易报告</h1>
    <label class="locale-wrap">
      <select id="localeSelect" class="locale-select" aria-label="Language"></select>
    </label>
  </header>
  <main class="report-page-main" id="reportPageMain">
    <section class="report-filter" id="reportFilter" hidden>
      <label class="report-filter-field">
        <span data-i18n="report.filterFrom">开始日期</span>
        <input type="date" id="reportDateFrom" class="report-date-input" />
      </label>
      <span class="report-filter-sep">–</span>
      <label class="report-filter-field">
        <span data-i18n="report.filterTo">结束日期</span>
        <input type="date" id="reportDateTo" class="report-date-input" />
      </label>
      <button type="button" id="reportFilterReset" class="report-filter-reset" data-i18n="report.filterReset">重置</button>
      <span class="muted report-filter-count" id="reportFilterCount"></span>
    </section>
    <div id="reportEmpty" class="report-empty hidden" data-i18n="report.empty">暂无平仓记录</div>
    <div id="reportContent" class="report-content hidden">
      <section class="report-kpi" id="reportKpi" aria-label="KPI"></section>
      <section class="report-equity-card">
        <div class="report-equity-head">
          <h2 class="report-section-title" data-i18n="report.equityCurve">净值曲线</h2>
          <div class="report-period-tabs" role="group" data-i18n-aria="report.equityPeriod" aria-label="Equity period">
            <button type="button" class="report-period-btn" data-period="trade" data-i18n="report.periodTrade">逐笔</button>
            <button type="button" class="report-period-btn active" data-period="day" data-i18n="report.periodDay">按天</button>
            <button type="button" class="report-period-btn" data-period="week" data-i18n="report.periodWeek">按周</button>
            <button type="button" class="report-period-btn" data-period="month" data-i18n="report.periodMonth">按月</button>
          </div>
        </div>
        <div id="equityChart" class="mt5-equity-chart report-equity-chart"></div>
      </section>
      <section class="report-metrics-card report-metrics-card-full">
        <div id="ordersReportTable" class="mt5-report-table-wrap"></div>
      </section>
    </div>
  </main>
  <script>window.__API_BASE__ = "";</script>
  <script src="/i18n.js?v=21"></script>
  <script src="/order_stats.js?v=1"></script>
  <script src="/report_page.js?v=3"></script>
</body>
</html>
