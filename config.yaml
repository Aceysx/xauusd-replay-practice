# 回测复盘练习工具配置

paths:
  root: .
  statement: Statement.htm
  m5_dir: Files
  m5_glob: "xauusd_xauusdm_m5_{date}.csv"
  m1_glob: "xauusd_xauusdm_m1_{date}.csv"
  m15_glob: "xauusd_xauusdm_m15_{date}.csv"
  m30_glob: "xauusd_xauusdm_m30_{date}.csv"
  h1_glob: "xauusd_xauusdm_h1_{date}.csv"
  h4_glob: "xauusd_xauusdm_h4_{date}.csv"
  d1_glob: "xauusd_xauusdm_d1_{date}.csv"

timezone:
  broker_utc_offset_hours: 3
  m5_timezone: UTC

strategy:
  default_sl: 5
  default_tp: 20
  limit_offset: 2
  ladder_tp: [10, 20, 30]

replay:
  port: 8765
  # 图表一次最多绘制的 K 线根数（约 800 根 ≈ 3 个交易日）
  chart_visible_bars: 800
  # 首次打开加载最近 N 个交易日
  initial_trading_days: 30
  load_chunk_trading_days: 30
  default_trading_days: 30
  bar_ms_per_candle_at_1x: 300
  default_timeframe: 5m
  # 随机回测起点：该日之后至少还有多少个交易日可向前练习
  random_backtest_min_forward_days: 10

server:
  host: "127.0.0.1"
